name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt

      - name: Install package + dev/test deps
        run: make install-dev

      - name: Static-analysis gate
        run: make check

      - name: Tests
        run: make test

      - name: Notebook lint
        run: make nb-lint
